[package]
name = "wirepf-daemon"
version = "0.1.0"
edition.workspace = true
description = "eBPF-based DNAT/SNAT/MASQUERADE port forwarder daemon with a REST control API"

license.workspace = true

[dependencies]
wirepf-common = { path = "../wirepf-common", features = ["user", "dto"] }

anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
aya-log = { workspace = true }
env_logger = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
    "sync",
] }
clap = { workspace = true, features = ["derive"] }
axum = "0.8.9"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
nix = { version = "0.31.3", features = ["net"] }
[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }
# TODO(https://github.com/rust-lang/cargo/issues/12375): this should be an artifact dependency, but
# it's not possible to tell cargo to use `-Z build-std` to build it. We cargo-in-cargo in the build
# script to build this, but we want to teach cargo about the dependency so that cache invalidation
# works properly.
#
# Note also that https://github.com/rust-lang/cargo/issues/10593 occurs when `target = ...` is added
# to an artifact dependency; it seems possible to work around that by setting `resolver = "1"` in
# Cargo.toml in the workspace root.
#
# Finally note that *any* usage of `artifact = ...` in *any* Cargo.toml in the workspace breaks
# workflows with stable cargo; stable cargo outright refuses to load manifests that use unstable
# features.
wirepf-ingress-ebpf = { path = "../wirepf-ingress-ebpf" }
wirepf-egress-ebpf = { path = "../wirepf-egress-ebpf" }

[[bin]]
name = "wirepf"
path = "src/main.rs"

[package.metadata.deb]
name = "wirepf"
maintainer = "Allen <mail@drchi.co.kr>"
copyright = "2026, Allen"
license-file = "../LICENSE"
extended-description = "eBPF-based DNAT/SNAT/MASQUERADE port forwarder with a REST control API."
depends = "$auto"
section = "net"
priority = "optional"
assets = [
    ["target/release/wirepf", "usr/bin/", "755"],
    ["debian/config.example.json", "etc/wirepf/config.json", "640"],
]
conf-files = ["/etc/wirepf/config.json"]
maintainer-scripts = "debian/"
systemd-units = { unit-name = "wirepf", enable = true, start = true, restart-after-upgrade = true }
